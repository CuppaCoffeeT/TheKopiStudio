<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Kopi mark: serif italic K, ink on card cream, closed by the hairline —
       the same grammar as the wordmark (Instrument Serif falls back to
       Georgia in favicon contexts, matching the app's own serif stack). -->
  <rect width="64" height="64" rx="14" fill="#FAF6EE"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#D9CCC0" stroke-width="2"/>
  <text x="33" y="45" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-style="italic" text-anchor="middle" fill="#3A2E24">K</text>
</svg>
