name: Seatbelt (W22)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: seatbelt-${{ github.ref }}
  cancel-in-progress: true

# Read-only: nothing here pushes back. `contents: write` was here for the
# sync-ledger job, removed 2026-07-27 (see below) — least privilege now.
permissions:
  contents: read

jobs:
  typecheck-lint:
    name: TypeScript + ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: tsc --noEmit
        run: npx tsc --noEmit
      - name: ESLint (max-warnings=15 — zero-debt ratchet, lowered from 1610 after full any-cleanup 2026-05-29)
        run: npm run lint
      - name: dependency-cruiser drift (net-new vs baseline — circular=0, cross-feature/page ratcheting down)
        run: npm run drift:check
      - name: vite production build
        run: npm run build
      - name: per-file LOC ratchet (count over 200 LOC may only decrease)
        run: npm run loc:check

  e2e-p0:
    name: Playwright @p0 (${{ matrix.project }})
    runs-on: ubuntu-latest
    # Was 20. `supabase start` pulls ~5 images and applies the baseline
    # migration + seed before Playwright even boots — budget for the cold pull.
    timeout-minutes: 35
    needs: typecheck-lint
    strategy:
      fail-fast: false
      # STILL SERIAL, but for a different (and temporary) reason. The original
      # reason is GONE: as of the ephemeral-DB change below, each matrix leg
      # starts its OWN Supabase on its OWN runner, so there is no longer a
      # shared book for dashboard.spec (asserts the advisor book is EMPTY) to
      # race against portfolio-convert.spec (asserts baseline+1) — the
      # cross-host hole in tests/fixtures/advisorBookLock.ts (a per-host
      # `mkdir` mutex) no longer matters, because there is nothing to share.
      #
      # Kept at 1 only to get ONE green serial run on the new stack first.
      # Raising this is a deliberate follow-up: flip to 2, confirm green twice,
      # and delete this block. Do NOT raise it in the same change that
      # introduces the ephemeral DB — that would leave two variables in play if
      # it goes red.
      max-parallel: 1
      matrix:
        project: [chromium-desktop, mobile-safari]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci

      # ── Ephemeral Supabase ────────────────────────────────────────────────
      # Until 2026-08-13 this job ran against the LIVE production project via
      # repo secrets. That left `E2E-…` residue in prod on every run and raced
      # three shared accounts across the two matrix legs, which is why the
      # badge was red for weeks for reasons unrelated to the code.
      #
      # Everything below is deterministic and non-secret: the local anon /
      # service_role keys are the fixed demo JWTs the CLI derives from its
      # default JWT secret, and the test passwords are committed constants for
      # a database that is destroyed with the runner. No GitHub secret is read
      # by this job any more.
      # Design + rationale: docs/06-operations/CI_TEST_DB_ISOLATION.md
      - uses: supabase/setup-cli@v1
        with:
          # Pinned, not `latest` — supabase/config.toml uses `[db.seed]`,
          # `[edge_runtime]` and `major_version = 17`, and a CLI that predates
          # any of those fails at `start` rather than at parse.
          version: 2.114.0
      - name: Start ephemeral Supabase (db + auth + rest + edge functions)
        # Applies supabase/migrations/00000000000000_baseline_prod_schema.sql
        # (the faithful prod public schema) then supabase/seed.sql (RBAC
        # backbone + the 8 legacy `results` fixtures). studio/storage/realtime/
        # analytics are disabled in config.toml — the suite touches none of them.
        run: supabase start
      - name: Export the local (non-secret) keys into the job env
        # `-o env` emits KEY="value" pairs; $GITHUB_ENV takes them literally, so
        # the quotes must be stripped or every value arrives wrapped in `"`.
        run: supabase status -o env | sed 's/"//g' >> "$GITHUB_ENV"
      - name: Seed the three E2E auth accounts
        # Admin API, not raw SQL — see the header of the script for why, and for
        # the three role surfaces (JWT app_metadata, public.users,
        # public.profiles) it has to line up. Fails loudly here rather than as
        # N opaque login timeouts.
        run: node tests/setup/seed-auth-users.mjs
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_KEY: ${{ env.SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          TEST_ADVISOR_PASSWORD: e2e-advisor-pw
          TEST_MANAGER_PASSWORD: e2e-manager-pw
          TEST_SUPER_ADMIN_PASSWORD: e2e-superadmin-pw
          # Fourth account: the stand-in owner of the legacy "Bee zhen" row.
          # Never signs in — the specs need the row to belong to somebody who
          # is not any of the three above. See the seed script for why.
          TEST_LEGACY_OWNER_PASSWORD: legacy-owner-pw

      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run @p0 seatbelt (${{ matrix.project }})
        env:
          CI: 'true'
          # There is no .env in CI — it is gitignored. Every value below is a
          # literal or comes from `supabase status` (exported two steps up).
          #
          # Required, or the run cannot start:
          #   VITE_SUPABASE_URL · VITE_SUPABASE_PUBLISHABLE_KEY  (global-setup contract)
          #   SUPABASE_KEY                                       (service role; supabaseChecks
          #                                                       throws at import)
          #   TEST_{ADVISOR,MANAGER,SUPER_ADMIN}_PASSWORD        (auth.setup signs in per role)

          # Dev server (npm run dev) needs the VITE_* names
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.ANON_KEY }}

          # tests/runners/supabaseChecks.ts — SUPABASE_URL falls back to
          # VITE_SUPABASE_URL; SUPABASE_KEY (service role) has no fallback.
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_KEY: ${{ env.SERVICE_ROLE_KEY }}

          # tests/fixtures/testUsers.ts — emails and user-ids have committed
          # defaults that match tests/setup/seed-auth-users.mjs, so only the
          # passwords are passed. These are constants for a throwaway DB, NOT
          # secrets; changing one here means changing it in the seed step too.
          TEST_ADVISOR_PASSWORD: e2e-advisor-pw
          TEST_MANAGER_PASSWORD: e2e-manager-pw
          TEST_SUPER_ADMIN_PASSWORD: e2e-superadmin-pw
        # NO --config: this uses the base playwright.config.ts, which is tuned
        # for CI (workers 2, retries 2, trace/video off, 90s timeout) and now
        # declares the `setup` project that mints tests/.auth/<role>.json.
        # `--grep @p0` does NOT filter setup out — Playwright exempts dependency
        # projects from grep — so all 3 sessions are minted, then 45 @p0 specs
        # run. Verified with `--list`: 48 tests in 15 files.
        #
        # Do NOT point this at playwright.parallel.config.ts. That config is
        # LOCAL-ONLY by its own header, and it overrides workers to 10 and
        # retries to 1 — 10 Chromium instances on a 2-vCPU runner, which is what
        # timed out ClientsPage.waitForDetail on 2026-07-27. It now selects
        # FEWER specs, not the same set: its `testIgnore: '**/auth/**'` matched
        # nothing until tests/workflows/auth/auth-public.spec.ts landed
        # (2026-08-13), and would now silently drop those 4 @p0 tests.
        run: >-
          npx playwright test
          --grep @p0
          --project=${{ matrix.project }}
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7
      - name: Supabase container logs on failure
        # A red run on the new stack is far more often "the DB never came up
        # right" than "a spec broke". Print that first so the next person does
        # not read 45 login timeouts looking for the cause.
        if: failure()
        run: |
          supabase status || true
          docker ps -a || true
          for c in $(docker ps -aq --filter "name=supabase_"); do
            echo "───── $(docker inspect --format '{{.Name}}' "$c") ─────"
            docker logs --tail 100 "$c" 2>&1 || true
          done

# REMOVED 2026-07-27 — the `sync-ledger` job.
#
# It stamped a "Last CI green" line into
# docs/99-refactor/_system/ledgers/WORKFLOW_LEDGER.md, then committed and pushed
# back to main. That file has NEVER existed in this repo — `git log --all` on the
# path returns nothing, and docs/99-refactor/_system/ has no ledgers/ directory.
# The job is AppBase scaffolding that came along with the workflow.
#
# It went unnoticed because it is gated `if: success()`, so it only ever runs
# when BOTH earlier jobs pass — and until run 30258158536 the suite had never
# been fully green on this repo. The first genuinely green run was therefore
# reported as a FAILURE, purely because this job crashed with
# FileNotFoundError on a path that was never there. A run that turns red
# *because the tests passed* trains everyone to ignore the badge, which is the
# same failure the @pushgate removal was about (tests/lessons.md 2026-07-24).
#
# Its hardcoded status line was stale independently: it advertised
# "WF-9000 capped at SMOKE_MAX_ROUTES=5", but SMOKE_MAX_ROUTES was already dead
# and was dropped from this workflow's env earlier the same day.
#
# To restore: create the ledger file first, confirm the path resolves in CI, and
# re-add `permissions: contents: write` (dropped above to least privilege).
